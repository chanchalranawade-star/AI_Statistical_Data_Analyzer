<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AI Statistical Data Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="register-page">

    <!-- LEFT IMAGE SECTION -->
    <div class="register-image">

        <img src="{{ url_for('static', filename='images/register.png') }}"
             alt="AI Data Analytics">

        <div class="image-overlay">
            <h2>Analyze Smarter.</h2>
            <p>
                Turn your data into meaningful insights
                with AI-powered statistical analysis.
            </p>
        </div>

    </div>


    <!-- RIGHT REGISTER SECTION -->
    <div class="register-section">

        <div class="register-card">

            <div class="register-logo">
                📊
            </div>

            <h1>Create Account</h1>

            <p class="register-subtitle">
                Join AI Statistical Data Analyzer
            </p>

            <form method="POST">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           placeholder="Enter your full name"
                           required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           placeholder="Enter your email"
                           required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password"
                           name="password"
                           placeholder="Create a password"
                           required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password"
                           name="confirm_password"
                           placeholder="Confirm your password"
                           required>
                </div>

                <button type="submit" class="register-submit">
                    Create Account
                </button>

            </form>

            <p class="account-text">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

            <a href="{{ url_for('home') }}" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
